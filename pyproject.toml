[project]
name = "delphi-kit"
version = "0.1.0"
description = "Read and trade Delphi prediction markets from Python and AI agents, with no API key: every market type, quotes, trades, positions, search, alerts and an MCP server."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = ["delphi", "gensyn", "prediction-markets", "mcp", "agents", "web3"]
dependencies = [
    "httpx>=0.27",
    "web3>=7",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
delphi = "delphi_kit.cli:main"
delphi-mcp = "delphi_kit.mcp_server:main"

[project.urls]
Repository = "https://github.com/neromtoobad/delphi-kit"
