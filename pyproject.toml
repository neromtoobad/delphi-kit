[project]
name = "delphi-kit"
version = "0.3.0"
description = "Renamed: delphi-kit is now agon-delphi (Agon for Python). This release installs agon-delphi and re-exports it."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = ["delphi", "gensyn", "prediction-markets", "mcp", "agents", "web3"]
dependencies = [
    "agon-delphi>=0.3.0",
]

[project.optional-dependencies]
mcp = [
    "agon-delphi[mcp]>=0.3.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
delphi = "delphi_kit.cli:main"
delphi-mcp = "delphi_kit.mcp_server:main"

[project.urls]
Homepage = "https://agon.nerom.site"
Repository = "https://github.com/neromtoobad/agon"
